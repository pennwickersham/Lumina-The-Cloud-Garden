name: Build release bundle

# Run by hand from the Actions tab. Produces the signed .aab to upload to
# Google Play, signed with the keystore details stored as repository secrets:
#   LUMINA_KEYSTORE_PASSWORD  keystore password (required)
#   LUMINA_KEY_PASSWORD       key password (optional, defaults to the keystore password)
#   LUMINA_KEY_ALIAS          key alias (optional, defaults to "lumina")
#   LUMINA_KEYSTORE_BASE64    base64 of the .keystore file (optional; without it
#                             the build uses android/app/lumina-release.keystore)
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept SDK licenses and top up packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install dependencies
        run: npm install

      - name: Copy the game in
        run: npx cap sync android

      - name: Prepare signing
        env:
          LUMINA_KEYSTORE_PASSWORD: ${{ secrets.LUMINA_KEYSTORE_PASSWORD }}
          LUMINA_KEYSTORE_BASE64: ${{ secrets.LUMINA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$LUMINA_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the LUMINA_KEYSTORE_PASSWORD repository secret before building a release."
            exit 1
          fi
          if [ -n "$LUMINA_KEYSTORE_BASE64" ]; then
            echo "$LUMINA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumina-release.keystore"
            echo "LUMINA_KEYSTORE_FILE=$RUNNER_TEMP/lumina-release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Assemble
        env:
          LUMINA_KEYSTORE_PASSWORD: ${{ secrets.LUMINA_KEYSTORE_PASSWORD }}
          LUMINA_KEY_PASSWORD: ${{ secrets.LUMINA_KEY_PASSWORD }}
          LUMINA_KEY_ALIAS: ${{ secrets.LUMINA_KEY_ALIAS }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: lumina-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
