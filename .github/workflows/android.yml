name: Build debug APK

# Push to the repo and collect an installable APK from the run's
# Artifacts section. No local Android SDK needed.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu-latest image already ships the Android SDK, so there is no
      # setup action here on purpose. android-actions/setup-android tries to
      # install the retired "tools" package and fails before the build starts.
      - name: Accept SDK licenses and top up packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Generate icons and splash screens
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Copy the game in
        run: npx cap sync android

      - name: Assemble
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: lumina-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
